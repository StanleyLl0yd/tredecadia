name: M5 v1.1 RC promotion helper

on:
  push:
    branches: [m5/v1.1.0-rc.1]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: m5/v1.1.0-rc.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build v1.1.0-rc.1 normative candidate
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          V='1.1.0-rc.1'
          root=Path('.')

          citation=root/'CITATION.cff'
          s=citation.read_text()
          assert 'version: "1.0.0"' in s
          s=s.replace('version: "1.0.0"', f'version: "{V}"', 1)
          citation.write_text(s)

          versioned_json=[
            'registry/months.json','registry/calendar.json','registry/localizations.json',
            'tests/test-vectors.json','tests/conversion-vectors.json',
            'tests/short4-ux-vectors.json','tests/accessibility-vectors.json'
          ]
          for p in versioned_json:
              path=root/p
              data=json.loads(path.read_text())
              assert data['specVersion']=='1.0.0', p
              data['specVersion']=V
              if p.startswith('registry/'):
                  data['status']='draft'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')

          # Promote all six cleared candidates into the normative localization registry.
          loc_path=root/'registry/localizations.json'
          loc=json.loads(loc_path.read_text())
          candidates=json.loads((root/'rationale/additional-script-localization-candidates.json').read_text())['profiles']
          decisions={d['id']:d for d in json.loads((root/'rationale/additional-script-localization-decisions.json').read_text())['decisions']}
          expected={'ka-Geor','hy-Armn','ar-Arab','hi-Deva','bn-Beng','fa-Arab'}
          assert {p['id'] for p in candidates}==expected
          assert all(decisions[i]['decision']=='accept-reviewed' for i in expected)
          assert {p['id'] for p in loc['profiles']}=={'ru-Cyrl','ja-Kana','ko-Hang'}
          # Existing stable profiles remain stable across the minor-release candidate.
          for p in loc['profiles']:
              assert p['review']['status']=='stable'
          for c in candidates:
              loc['profiles'].append({
                  'id':c['id'], 'languageTag':c['languageTag'], 'script':c['script'],
                  'direction':c['direction'], 'role':'display-alias', 'method':c['method'],
                  'caseTransform':'none', 'reverseMapping':'unique-within-profile',
                  'review':{'status':'reviewed','evidence':c['evidence']},
                  'syllableMap':c['syllableMap'], 'aliases':c['aliases'], 'notes':c['notes'],
              })
          loc_path.write_text(json.dumps(loc, ensure_ascii=False, indent=2)+'\n')

          specs=[
            'specification/calendar-standard.md','specification/conversion-standard.md',
            'specification/date-notation.md','specification/month-naming-standard.md',
            'specification/localization.md','specification/localization-profiles.md',
            'specification/compatibility.md'
          ]
          for p in specs:
              path=root/p
              text=path.read_text()
              text,n=re.subn(r'^Status: \*\*1\.0\.0[^\n]*\*\*$', f'Status: **{V} — release candidate**', text, count=1, flags=re.M)
              assert n==1, p
              path.write_text(text)

          lp=root/'specification/localization-profiles.md'
          text=lp.read_text()
          text=text.replace(
              '`stable` means the reviewed profile was explicitly accepted into a stable Tredecadia release. A profile MUST NOT be `stable` while the localization registry itself is `draft`.',
              '`stable` means the reviewed profile was explicitly accepted into a stable Tredecadia release. A profile first introduced by a draft/release-candidate registry MUST NOT be marked `stable` before explicit stable acceptance. Profiles already stable in an earlier compatible release retain `stable` maturity while a later minor release candidate is evaluated.'
          )
          text += f'''\n\n## {V} additional-script profiles\n\nThe compatible v1.1 release candidate carries forward the stable `ru-Cyrl`, `ja-Kana`, and `ko-Hang` profiles unchanged and adds six month-only profiles at `reviewed` maturity: `ka-Geor`, `hy-Armn`, `ar-Arab`, `hi-Deva`, `bn-Beng`, and `fa-Arab`. Their mappings and review evidence are recorded in `registry/localizations.json` and the M5 rationale ledger. No native-speaker usability study is claimed for these six profiles. Weekday aliases remain out of scope.\n'''
          lp.write_text(text)

          # Current release metadata.
          (root/'release/publish.json').write_text(json.dumps({
              'version':V,'tag':f'v{V}','prerelease':True,'notes':f'release/notes/{V}.md'
          }, indent=2)+'\n')
          notes=root/f'release/notes/{V}.md'
          notes.write_text(f'''# Tredecadia {V}\n\nThis compatible v1.1 release candidate adds six reviewed month-display localization profiles without changing Tredecadia v1 canonical calendar identity.\n\nNew reviewed month profiles:\n\n- `ka-Geor` — Georgian Mkhedruli\n- `hy-Armn` — Eastern Armenian\n- `ar-Arab` — fully vocalized Arabic\n- `hi-Deva` — Hindi-oriented Devanagari\n- `bn-Beng` — Bengali\n- `fa-Arab` — Iranian Persian\n\nThe existing stable `ru-Cyrl`, `ja-Kana`, and `ko-Hang` profiles are carried forward unchanged. The six new profiles remain `reviewed` during the release-candidate phase; stable promotion requires an explicit later decision.\n\nCanonical month and weekday names, month numbers/order, `W1..W7`, date grammar, Tredecadia Era, epoch, leap rule, and conversion semantics are unchanged from `v1.0.0`. Weekday aliases are not introduced.\n''')

          changelog=root/'CHANGELOG.md'
          text=changelog.read_text()
          marker='# Changelog\n'
          assert marker in text
          section=f'''\n## {V} — 2026-09-17\n\n- Add reviewed month-display profiles for Georgian Mkhedruli, Eastern Armenian, fully vocalized Arabic, Hindi-oriented Devanagari, Bengali, and Iranian Persian.\n- Preserve the three previously stable Russian, Japanese, and Korean profiles unchanged.\n- Preserve all v1 canonical month/weekday, era, date-syntax, and conversion identity.\n\n'''
          text=text.replace(marker, marker+section, 1)
          changelog.write_text(text)

          # Reader-facing current-version markers. Replace only the first code-form version token.
          for path in sorted(root.glob('README*.md')):
              text=path.read_text()
              if '`1.0.0`' in text:
                  text=text.replace('`1.0.0`', f'`{V}`', 1)
                  path.write_text(text)
          # English status/release links need semantic correction beyond the version token.
          p=root/'README.md'; text=p.read_text()
          text=text.replace(f'> **Status: `{V}` published; fresh RC2 observation window open.**', f'> **Status: `{V}` release candidate; stable `v1.0.0` remains published.**')
          text=text.replace('Published release: [`v1.0.0-rc.2`](https://github.com/StanleyLl0yd/tredecadia/releases/tag/v1.0.0-rc.2)  \nHistorical published RC: [`v1.0.0-rc.1`](https://github.com/StanleyLl0yd/tredecadia/releases/tag/v1.0.0-rc.1)', 'Stable release: [`v1.0.0`](https://github.com/StanleyLl0yd/tredecadia/releases/tag/v1.0.0)  \nHistorical RCs: [`v1.0.0-rc.2`](https://github.com/StanleyLl0yd/tredecadia/releases/tag/v1.0.0-rc.2) · [`v1.0.0-rc.1`](https://github.com/StanleyLl0yd/tredecadia/releases/tag/v1.0.0-rc.1)')
          p.write_text(text)

          # Keep Pages/index/changelog on the current candidate identifier.
          for p in ['docs/index.md']:
              path=root/p; text=path.read_text();
              if '`1.0.0`' in text: text=text.replace('`1.0.0`',f'`{V}`',1)
              elif '1.0.0' in text: text=text.replace('1.0.0',V,1)
              path.write_text(text)

          # Evolve normative localization validation for a compatible minor RC.
          path=root/'tests/validate_localizations.py'; text=path.read_text()
          text=text.replace('INVENTORY = MONTH_DATA["syllableInventory"]', 'INVENTORY = MONTH_DATA["syllableInventory"]\nLEGACY_STABLE_IDS = {"ru-Cyrl", "ja-Kana", "ko-Hang"}\nV11_REVIEWED_IDS = {"ka-Geor", "hy-Armn", "ar-Arab", "hi-Deva", "bn-Beng", "fa-Arab"}')
          text=text.replace('assert set(ids) == {"ru-Cyrl", "ja-Kana", "ko-Hang"}', 'assert set(ids) == LEGACY_STABLE_IDS | V11_REVIEWED_IDS')
          text=text.replace('        if review["status"] == "stable":\n            assert LOC_DATA["status"] == "stable", "stable profile in draft registry"', '        if review["status"] == "stable" and LOC_DATA["status"] == "draft":\n            assert profile["id"] in LEGACY_STABLE_IDS, "new stable profile in draft registry"')
          old='''    # Prereleases deliberately keep reviewed profiles non-stable. At a stable\n    # release, exact accepted/rejected maturity is enforced by stable-plan CI.\n    if is_prerelease(version):\n        assert all(profile["review"]["status"] == "reviewed" for profile in profiles)\n    else:\n        assert all(profile["review"]["status"] in {"reviewed", "stable"} for profile in profiles)'''
          new='''    if version.startswith("1.1.0-rc."):\n        assert all(profile_by_id[i]["review"]["status"] == "stable" for i in LEGACY_STABLE_IDS)\n        assert all(profile_by_id[i]["review"]["status"] == "reviewed" for i in V11_REVIEWED_IDS)\n        candidate_pack = {p["id"]: p for p in json.loads((ROOT / "rationale/additional-script-localization-candidates.json").read_text(encoding="utf-8"))["profiles"]}\n        for pid in V11_REVIEWED_IDS:\n            registered = profile_by_id[pid]\n            candidate = candidate_pack[pid]\n            assert registered["syllableMap"] == candidate["syllableMap"]\n            assert registered["aliases"] == candidate["aliases"]\n            assert registered["notes"] == candidate["notes"]\n    elif is_prerelease(version):\n        assert all(profile["review"]["status"] == "reviewed" for profile in profiles)\n    else:\n        assert all(profile["review"]["status"] in {"reviewed", "stable"} for profile in profiles)'''
          assert old in text
          text=text.replace(old,new)
          path.write_text(text)

          # Remove the one-shot helper from the candidate tree.
          Path('.github/workflows/m5-v11-promote-helper.yml').unlink()
          PY
      - name: Commit candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "M5: build normative v1.1.0-rc.1 candidate"
          git push origin HEAD:m5/v1.1.0-rc.1
