name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Validate release publication metadata
        run: python tests/validate_release_metadata.py
      - name: Validate published release source locks
        run: python tests/validate_published_releases.py
      - name: Validate immutable v1 identity baseline
        run: python tests/validate_v1_identity.py
      - name: Validate RC2 weekday candidate
        run: python tests/validate_weekday_candidate.py
      - name: Validate planned RC2 weekday transition
        run: python tests/validate_rc2_transition.py
      - name: Validate M4 stable-promotion gate
        run: python tests/validate_stable_plan.py
      - name: Validate localization stable-readiness packets
        run: python tests/validate_profile_readiness.py
      - name: Validate RC observation gate
        run: python tests/validate_rc_observation.py
      - name: Validate stable preflight reporter
        run: python tests/validate_stable_preflight.py
      - name: Validate atomic stable-transition manifest
        run: python tests/validate_transition_manifest.py
      - name: Validate multilingual READMEs
        run: python tests/validate_readme_locales.py
      - name: Validate Pages deployment contract
        run: python tests/validate_pages.py
      - name: Validate published JSON Schemas
        run: python tests/validate_schemas.py
      - name: Validate repository-local links
        run: python tests/validate_links.py
      - name: Validate canonical registry and naming invariants
        run: python tests/validate_registry.py
      - name: Validate localization profiles
        run: python tests/validate_localizations.py
      - name: Validate Short-4 conversational and UX invariants
        run: python tests/validate_short4_ux.py
      - name: Validate signed-year accessibility and presentation
        run: python tests/validate_accessibility.py
      - name: Validate calendar conversion semantics
        run: python tests/validate_conversion.py
      - name: Validate v1 RC compatibility freeze
        run: python tests/validate_rc_freeze.py
      - name: Validate deterministic release bundle
        run: python tests/validate_release_build.py
      - name: Validate documentation consistency
        run: python tests/validate_docs.py
      - name: Check version consistency
        run: python tests/validate_versions.py
      - name: Cross-check Python reference implementation
        run: python tests/validate_reference.py
