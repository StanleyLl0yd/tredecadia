name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate canonical registry and naming invariants
        run: python tests/validate_registry.py
      - name: Validate localization profiles
        run: python tests/validate_localizations.py
      - name: Validate Short-4 conversational and UX invariants
        run: python tests/validate_short4_ux.py
      - name: Validate calendar conversion semantics
        run: python tests/validate_conversion.py
      - name: Validate documentation consistency
        run: python tests/validate_docs.py
      - name: Check version consistency
        run: python tests/validate_versions.py
      - name: Cross-check Python reference implementation
        run: python tests/validate_reference.py
