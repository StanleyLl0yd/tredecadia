name: Branch housekeeping

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-housekeeping
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete stale merged PR branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            if [ "$branch" = "main" ]; then
              echo "keep: $branch (default branch)"
              continue
            fi

            open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --limit 100 --json number --jq 'length')"
            if [ "$open_count" -gt 0 ]; then
              echo "keep: $branch ($open_count open PR)"
              continue
            fi

            merged_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state closed --limit 100 --json mergedAt --jq '[.[] | select(.mergedAt != null)] | length')"
            superseded=false
            case "$branch" in
              m4/rc2-weekdays|m4-pages-deployment) superseded=true ;;
            esac

            if [ "$merged_count" -gt 0 ] || [ "$superseded" = true ]; then
              echo "delete: $branch"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "keep: $branch (no merged PR evidence)"
            fi
          done
