name: M5 README profile sync

on:
  push:
    branches: [m5/v1.1.0-rc.1]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: m5/v1.1.0-rc.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Synchronize normative month aliases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('.')
          registry=json.loads((root/'registry/localizations.json').read_text())
          months=json.loads((root/'registry/months.json').read_text())['months']
          profiles={p['id']:p for p in registry['profiles']}
          targets={
            'README.ka.md': ('ka-Geor', 'Tredecadia `1.1.0-rc.1`-ში ქართული Mkhedruli თვეების საჩვენებელი პროფილი უკვე ნორმატიულ რეესტრშია `reviewed` სტატუსით. ქვემოთ ადგილობრივი ფორმა ნაჩვენებია პირველként, ხოლო ფრჩხილებში რჩება უცვლელი კანონიკური ლათინური იდენტობა.'),
            'README.hy.md': ('hy-Armn', 'Tredecadia `1.1.0-rc.1`-ում արևելահայերեն գրությամբ ամիսների ցուցադրման պրոֆիլը ներառված է նորմատիվ գրանցամատյանում `reviewed` կարգավիճակով։ Ստորև նախ տրված է տեղային գրությունը, իսկ փակագծերում պահպանվում է անփոփոխ կանոնական լատինատառ նույնականացումը։'),
            'README.ar.md': ('ar-Arab', 'في `1.1.0-rc.1` أصبح ملف عرض أسماء الأشهر بالعربية المشكولة بالكامل جزءاً من السجل المعياري بحالة `reviewed`. يظهر الشكل العربي أولاً، وتبقى الهوية اللاتينية المعيارية غير المتغيرة بين قوسين.'),
            'README.hi.md': ('hi-Deva', '`1.1.0-rc.1` में हिंदी-उन्मुख देवनागरी माह-प्रदर्शन प्रोफ़ाइल `reviewed` स्थिति के साथ मानक रजिस्ट्री का भाग है। नीचे स्थानीय लिपि पहले दी गई है और अपरिवर्तित कैनोनिकल लैटिन पहचान कोष्ठक में बनी रहती है।'),
            'README.bn.md': ('bn-Beng', '`1.1.0-rc.1`-এ বাংলা মাস-প্রদর্শন প্রোফাইলটি `reviewed` অবস্থায় মানক রেজিস্ট্রির অংশ। নিচে বাংলা রূপটি আগে দেখানো হয়েছে এবং অপরিবর্তিত ক্যানোনিক্যাল লাতিন পরিচয় বন্ধনীর মধ্যে রাখা হয়েছে।'),
            'README.fa.md': ('fa-Arab', 'در `1.1.0-rc.1` نمایهٔ نمایش نام ماه‌ها به خط فارسی با وضعیت `reviewed` بخشی از رجیستری هنجاری است. در جدول زیر صورت فارسی نخست می‌آید و هویت لاتینِ معیار و تغییرناپذیر داخل پرانتز حفظ می‌شود.'),
          }

          canonical={m['number']:m for m in months}
          for filename,(pid,intro) in targets.items():
              profile=profiles[pid]
              assert profile['review']['status']=='reviewed', (pid, profile['review']['status'])
              aliases={a['month']:a for a in profile['aliases']}
              path=root/filename
              lines=path.read_text().splitlines()
              table=next(i for i,line in enumerate(lines) if line.startswith('| # |'))
              heading=max(i for i in range(table) if lines[i].startswith('## '))
              lines=lines[:heading+1]+['',intro,'']+lines[table:]
              for n in range(1,14):
                  m=canonical[n]; a=aliases[n]
                  row=f"| {n:02d} | {a['full']} ({m['canonical']}) | {a['short6']} ({m['short6']}) | {a['short4']} ({m['short4']}) |"
                  indexes=[i for i,line in enumerate(lines) if line.startswith(f'| {n:02d} |')]
                  assert len(indexes)==1, (filename,n,indexes)
                  lines[indexes[0]]=row
              path.write_text('\n'.join(lines)+'\n')

          Path('.github/workflows/m5-readme-profile-sync.yml').unlink()
          PY
      - name: Commit synchronized READMEs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "M5: synchronize six normative local-script READMEs"
          git push origin HEAD:m5/v1.1.0-rc.1
